name: Restore prepared portfolio files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited repository contents
        shell: bash
        env:
          PORTFOLIO_ARCHIVE: ""
        run: |
          printf '%s' "$PORTFOLIO_ARCHIVE" | base64 --decode > /tmp/portfolio-files.tar.gz
          tar -xzf /tmp/portfolio-files.tar.gz
      - name: Verify and commit
        shell: bash
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          :
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Restore prepared portfolio project"
          git push
